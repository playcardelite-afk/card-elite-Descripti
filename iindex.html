

<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Card Elite | Streaming Premium</title>
<style>
:root {
  --bg: #090711;
  --card: #171124;
  --purple: #9955ff;
  --text: #fff;
  --muted: #aaa1b9;
}
* { box-sizing: border-box; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--text);
  font-family: Arial, sans-serif;
}
header {
  height: 70px;
  padding: 0 5%;
  display: flex;
  align-items: center;
  justify-content: space-between;
  background: #0b0812;
  border-bottom: 1px solid #30203e;
  position: sticky;
  top: 0;
  z-index: 10;
}
.logo {
  font-size: 23px;
  font-weight: 900;
  letter-spacing: 2px;
}
.logo span { color: var(--purple); }
nav { display: flex; gap: 25px; }
nav a {
  color: white;
  text-decoration: none;
  font-size: 14px;
}
.hero {
  min-height: 390px;
  padding: 75px 7%;
  display: flex;
  align-items: center;
  background:
    linear-gradient(90deg,#090711 10%,#090711dd 50%,transparent),
    radial-gradient(circle at 80%,#6726a9,#171024 55%,#090711);
}
.hero-content { max-width: 600px; }
.hero h1 {
  font-size: clamp(42px,6vw,68px);
  line-height: 1;
  margin: 15px 0;
}
.hero h1 span { color: var(--purple); }
.hero p { color: #d0c7db; line-height: 1.7; }
.btn {
  display: inline-block;
  margin-top: 15px;
  background: var(--purple);
  color: white;
  padding: 14px 23px;
  border-radius: 8px;
  text-decoration: none;
  font-weight: bold;
}
main { padding: 35px 5%; }
.heading {
  font-size: 23px;
  margin: 15px 0 20px;
}
.heading span { color: var(--purple); }
.shelf {
  display: grid;
  grid-auto-flow: column;
  grid-auto-columns: 210px;
  gap: 16px;
  overflow-x: auto;
  padding: 5px 2px 20px;
}
.product {
  background: var(--card);
  border: 1px solid #30203e;
  border-radius: 12px;
  overflow: hidden;
  transition: .2s;
}
.product:hover {
  transform: translateY(-5px);
  border-color: var(--purple);
}
.poster {
  height: 135px;
  display: grid;
  place-items: center;
  font-size: 45px;
  background: radial-gradient(circle,#7138a5,#24142f);
}
.info { padding: 14px; }
.info h3 { margin: 0 0 8px; font-size: 16px; }
.info p { color: var(--muted); font-size: 12px; }
.price { font-size: 20px; font-weight: bold; margin: 12px 0; }
.buy {
  width: 100%;
  border: 0;
  background: var(--purple);
  color: white;
  padding: 11px;
  border-radius: 7px;
  font-weight: bold;
  cursor: pointer;
}
.buy:disabled { opacity: .5; }
.status { color: var(--muted); font-size: 13px; }
footer {
  text-align: center;
  padding: 30px;
  border-top: 1px solid #30203e;
  color: var(--muted);
  font-size: 12px;
}
@media(max-width:600px) {
  nav { gap: 12px; }
  nav a { font-size: 12px; }
  header { padding: 0 15px; }
  .shelf { grid-auto-columns: 185px; }
}
</style>
</head>
<body>

<header>
  <div class="logo">♛ CARD <span>ELITE</span></div>
  <nav>
    <a href="#inicio">Início</a>
    <a href="#prateleira">Prateleira</a>
  </nav>
</header>

<section class="hero" id="inicio">
  <div class="hero-content">
    <p>EXPERIÊNCIA DIGITAL PREMIUM</p>
    <h1>Entre no universo <span>Elite.</span></h1>
    <p>Suas assinaturas digitais favoritas em uma única prateleira.</p>
    <a class="btn" href="#prateleira">EXPLORAR PRODUTOS</a>
  </div>
</section>

<main>
  <h2 class="heading" id="prateleira">
    Em destaque <span>para você</span>
  </h2>
  <div id="status" class="status">Carregando catálogo...</div>
  <div id="catalogo" class="shelf"></div>
</main>

<footer>
  © <span id="ano"></span> CARD ELITE — Todos os direitos reservados.
</footer>

<script>
document.getElementById('ano').textContent =
  new Date().getFullYear();

function escapar(valor) {
  return String(valor ?? '').replace(/[&<>"']/g, c => ({
    '&':'&amp;', '<':'&lt;', '>':'&gt;',
    '"':'&quot;', "'":'&#39;'
  }[c]));
}

function formatarPreco(valor) {
  return (Number(valor) / 100).toLocaleString('pt-BR', {
    style: 'currency',
    currency: 'BRL'
  });
}

async function carregarProdutos() {
  const status = document.getElementById('status');
  const catalogo = document.getElementById('catalogo');

  try {
    const resposta = await fetch('/api/produtos');
    const dados = await resposta.json();

    if (!resposta.ok) {
      throw new Error(dados.erro || 'Erro ao consultar produtos');
    }

    const produtos = Array.isArray(dados)
      ? dados
      : dados.produtos;

    if (!Array.isArray(produtos)) {
      throw new Error('Formato de catálogo inválido');
    }

    status.textContent =
      produtos.length + ' produtos encontrados';

    catalogo.innerHTML = produtos.map(p => `
      <article class="product">
        <div class="poster">♛</div>
        <div class="info">
          <h3>${escapar(p.nome)}</h3>
          <p>${escapar(p.servico)} · ${escapar(p.dias)} dias</p>
          <div class="price">
            ${formatarPreco(p.preco_centavos)}
          </div>
          <button class="buy"
            ${p.disponivel ? '' : 'disabled'}
            data-id="${escapar(p.id)}">
            ${p.disponivel ? 'COMPRAR' : 'INDISPONÍVEL'}
          </button>
        </div>
      </article>
    `).join('');

  } catch (erro) {
    status.textContent =
      'Não foi possível carregar o catálogo: ' + erro.message;
  }
}

document.getElementById('catalogo').addEventListener(
  'click', event => {
    const botao = event.target.closest('[data-id]');
    if (!botao) return;

    alert('Checkout ainda precisa ser integrado.');
  }
);

carregarProdutos();
</script>
</body>
</html>
