<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#080808">
<title>Card Elite | Streaming, Jogos e Apps</title>

<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:#080808;color:#fff;font-family:Arial,sans-serif;font-size:14px}
.wrap{max-width:1100px;margin:0 auto}
header{height:56px;display:flex;align-items:center;gap:10px;padding:0 12px;
position:sticky;top:0;z-index:10;background:#080808;border-bottom:1px solid #252525}
.brand{font-size:18px;font-weight:900;white-space:nowrap}
.brand span{color:#ed101c}
.search{flex:1;min-width:0;background:#1c1c1c;border:1px solid #333;
border-radius:20px;padding:9px 14px;color:#fff;font-size:13px;outline:none}
.search:focus{border-color:#ed101c}
#cart{background:#ed101c;border:0;border-radius:8px;padding:8px 12px;
color:#fff;font-weight:bold;cursor:pointer;white-space:nowrap}
.hero{padding:16px 12px 6px}
.hero h1{font-size:20px;line-height:1.2}
.hero h1 span{color:#ed101c}
.hero p{color:#aaa;font-size:12px;margin-top:5px}
.chips{display:flex;gap:8px;padding:10px 12px 6px;overflow-x:auto;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:0 0 auto;background:#1c1c1c;border:1px solid #333;color:#ddd;
border-radius:18px;padding:7px 14px;font-size:13px;cursor:pointer}
.chip.on{background:#ed101c;border-color:#ed101c;color:#fff;font-weight:bold}
#status{padding:0 12px 6px;color:#888;font-size:11px}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;padding:4px 12px 22px}
@media(min-width:600px){
.grid{grid-template-columns:repeat(auto-fill,minmax(140px,1fr))}
.hero h1{font-size:26px}
}
.product{background:#141414;border:1px solid #242424;border-radius:12px;
padding:8px;display:flex;flex-direction:column;gap:6px}
.tile{aspect-ratio:1;border-radius:10px;display:flex;align-items:center;
justify-content:center;overflow:hidden;background:#222}
.tile img{width:58%;height:58%;object-fit:contain}
.tile img.cover{width:100%;height:100%;object-fit:cover}
.tile .txt{font-weight:900;font-size:13px;text-align:center;padding:4px;
color:#fff;line-height:1.1}
.tile .ini{font-weight:900;font-size:28px;color:#ed101c}
.product h3{font-size:12px;line-height:1.25;min-height:30px;
display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.price{color:#19d47b;font-weight:bold;font-size:13px}
.product button{width:100%;background:#ed101c;border:0;padding:7px;
color:#fff;border-radius:6px;font-weight:bold;font-size:12px;cursor:pointer}
.product button:active{background:#bd0710}
.empty{grid-column:1/-1;padding:30px;text-align:center;color:#aaa}
footer{background:#120506;border-top:1px solid #333;padding:14px 12px;
display:flex;justify-content:center;gap:6px 16px;flex-wrap:wrap;
color:#bbb;font-size:12px}
footer strong{color:#ed101c}
#toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);
background:#19d47b;color:#000;font-weight:bold;font-size:13px;
padding:10px 16px;border-radius:20px;opacity:0;pointer-events:none;
transition:.25s;z-index:20;max-width:90%;text-align:center}
#toast.show{opacity:1}
</style>
</head>

<body>
<div class="wrap">

<header>
 <div class="brand">CARD <span>ELITE</span></div>
 <input class="search" id="search" placeholder="Pesquisar produtos...">
 <button id="cart" onclick="showCart()">🛒 <span id="count">0</span></button>
</header>

<div class="hero">
 <h1>Sua diversão em <span>um só lugar</span></h1>
 <p>⚡ Entrega rápida · 🛡️ Compra segura · 🎧 Suporte especializado</p>
</div>

<div class="chips" id="chips">
 <button class="chip on" data-cat="todos">Todos</button>
 <button class="chip" data-cat="streaming">📺 Streaming</button>
 <button class="chip" data-cat="jogos">🎮 Jogos</button>
 <button class="chip" data-cat="apps">▦ Apps</button>
 <button class="chip" data-cat="outros">⭐ Outros</button>
</div>

<div id="status">Carregando catálogo...</div>
<div class="grid" id="grid"></div>

<footer>
 <span>🚀 Ativação imediata</span>
 <span>🛡️ Pagamento seguro</span>
 <span>🎧 Suporte 24h</span>
 <strong>CARD ELITE</strong>
</footer>

</div>
<div id="toast"></div>

<script>
const API='/api/produtos';
let products=[];
let cart=[];
let cat='todos';
let query='';

/* Cada marca: cor oficial do fundo + logo em branco */
const brands=[
 {re:/netflix/,label:'Netflix',slug:'netflix',bg:'#141414',logo:'E50914'},
 {re:/disney/,label:'Disney+',slug:'disneyplus',bg:'#113CCF',logo:'FFFFFF'},
 {re:/prime|amazon/,label:'Prime Video',slug:'primevideo',bg:'#00A8E1',logo:'FFFFFF'},
 {re:/\bhbo\b|\bmax\b/,label:'HBO Max',slug:'hbo',bg:'#5822B4',logo:'FFFFFF'},
 {re:/spotify/,label:'Spotify',slug:'spotify',bg:'#1DB954',logo:'FFFFFF'},
 {re:/youtube/,label:'YouTube',slug:'youtube',bg:'#FF0000',logo:'FFFFFF'},
 {re:/crunchyroll/,label:'Crunchyroll',slug:'crunchyroll',bg:'#F47521',logo:'FFFFFF'},
 {re:/globoplay|globo/,label:'Globoplay',slug:'globoplay',bg:'#E4252B',logo:'FFFFFF'},
 {re:/xbox/,label:'Xbox',slug:'xbox',bg:'#107C10',logo:'FFFFFF'},
 {re:/playstation|\bps[345]?\b/,label:'PlayStation',slug:'playstation',bg:'#003791',logo:'FFFFFF'},
 {re:/minecraft/,label:'Minecraft',slug:'minecraft',bg:'#62A54C',logo:'FFFFFF'},
 {re:/fortnite/,label:'Fortnite',slug:'fortnite',bg:'#3A2A8C',logo:'FFFFFF'},
 {re:/roblox/,label:'Roblox',slug:'roblox',bg:'#E2231A',logo:'FFFFFF'},
 {re:/canva/,label:'Canva',slug:'canva',bg:'#00C4CC',logo:'FFFFFF'},
 {re:/adobe/,label:'Adobe',slug:'adobe',bg:'#E1251B',logo:'FFFFFF'},
 {re:/office|microsoft/,label:'Microsoft 365',slug:'microsoftoffice',bg:'#D83B01',logo:'FFFFFF'},
 {re:/chatgpt|openai/,label:'ChatGPT',slug:'openai',bg:'#10A37F',logo:'FFFFFF'},
 {re:/icloud/,label:'iCloud',slug:'icloud',bg:'#3693F3',logo:'FFFFFF'},
 {re:/nordvpn/,label:'NordVPN',slug:'nordvpn',bg:'#4687FF',logo:'FFFFFF'}
];

function norm(s){
 return String(s).normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase();
}
function findBrand(text){
 const t=norm(text);
 return brands.find(b=>b.re.test(t));
}
function getName(p){
 return p.name || p.nome || p.title || p.titulo ||
 p.product || p.produto || p.description || p.descricao || 'Produto';
}
function getImage(p){
 return p.image || p.imagem || p.image_url || p.imageUrl ||
 p.logo || p.icon || p.icone || p.thumbnail ||
 p.picture || p.photo || p.foto || p.url_imagem || '';
}
function getPrice(p){
 return p.price ?? p.preco ?? p.valor ?? p.sale_price ?? p.preco_venda;
}
function getCategory(p){
 return String(p.category || p.categoria || p.type || p.tipo || '').toLowerCase();
}
function money(v){
 if(v===undefined || v===null || v==='')return 'Consulte';
 if(typeof v==='string' && /R\$/.test(v))return v;
 let n=Number(String(v).replace(',','.'));
 return Number.isFinite(n)?n.toLocaleString('pt-BR',
 {style:'currency',currency:'BRL'}):String(v);
}
function classify(p){
 const s=norm(getName(p)+' '+getCategory(p));
 if(/netflix|disney|prime video|amazon prime|\bhbo\b|\bmax\b|globoplay|spotify|crunchyroll|youtube|paramount|streaming/.test(s))return 'streaming';
 if(/game|jogo|xbox|playstation|roblox|minecraft|fortnite|free fire|nintendo|steam/.test(s))return 'jogos';
 if(/\bapp\b|canva|adobe|office|microsoft|chatgpt|google|icloud|vpn/.test(s))return 'apps';
 return 'outros';
}

function makeTile(name,image){
 const tile=document.createElement('div');
 tile.className='tile';
 const brand=findBrand(name);

 function text(cls,content){
  tile.replaceChildren();
  const t=document.createElement('div');
  t.className=cls;
  t.textContent=content;
  tile.appendChild(t);
 }

 if(brand){
  tile.style.background=brand.bg;
  const img=document.createElement('img');
  img.alt=name;
  img.onerror=()=>text('txt',brand.label);
  img.src='https://cdn.simpleicons.org/'+brand.slug+'/'+brand.logo;
  tile.appendChild(img);
 }else if(image){
  const img=document.createElement('img');
  img.className='cover';
  img.alt=name;
  img.onerror=()=>text('ini',name.substring(0,2).toUpperCase());
  img.src=image;
  tile.appendChild(img);
 }else{
  text('ini',name.substring(0,2).toUpperCase());
 }
 return tile;
}

function makeCard(p){
 const name=getName(p);
 const idx=products.indexOf(p);
 const card=document.createElement('article');
 card.className='product';
 const title=document.createElement('h3');
 title.textContent=name;
 const value=document.createElement('div');
 value.className='price';
 value.textContent=money(getPrice(p));
 const btn=document.createElement('button');
 btn.textContent='Selecionar';
 btn.onclick=()=>addCart(idx);
 card.append(makeTile(name,getImage(p)),title,value,btn);
 return card;
}

function render(){
 const grid=document.getElementById('grid');
 grid.replaceChildren();
 const list=products.filter(p=>
  (cat==='todos'||classify(p)===cat) &&
  norm(getName(p)).includes(norm(query).trim())
 );
 list.forEach(p=>grid.appendChild(makeCard(p)));
 if(!list.length){
  const e=document.createElement('div');
  e.className='empty';
  e.textContent='Nenhum produto encontrado.';
  grid.appendChild(e);
 }
}

async function loadProducts(){
 const status=document.getElementById('status');
 try{
  const response=await fetch(API,{headers:{'Accept':'application/json'}});
  if(!response.ok)throw new Error('Erro HTTP '+response.status);
  const data=await response.json();
  products=Array.isArray(data)?data:
   data.products || data.produtos || data.data ||
   data.result || data.items || [];
  if(!Array.isArray(products))products=[];
  status.textContent=products.length
   ? products.length+' produtos disponíveis'
   : 'A API respondeu, mas não encontramos uma lista de produtos. Confira o formato do JSON.';
  render();
 }catch(error){
  status.textContent='Não foi possível carregar o catálogo: '+error.message;
  document.getElementById('grid').innerHTML=
   '<div class="empty">Não foi possível carregar os produtos. Verifique a API.</div>';
 }
}

let toastTimer;
function toast(msg){
 const t=document.getElementById('toast');
 t.textContent=msg;
 t.classList.add('show');
 clearTimeout(toastTimer);
 toastTimer=setTimeout(()=>t.classList.remove('show'),1800);
}
function addCart(index){
 const p=products[index];
 if(!p)return;
 cart.push(p);
 document.getElementById('count').textContent=cart.length;
 toast(getName(p)+' adicionado!');
}
function showCart(){
 if(!cart.length){
  toast('Sua seleção está vazia.');
  return;
 }
 alert('Produtos selecionados:\n'+cart.map(p=>getName(p)).join('\n'));
}

document.getElementById('chips').addEventListener('click',e=>{
 const b=e.target.closest('.chip');
 if(!b)return;
 cat=b.dataset.cat;
 document.querySelectorAll('.chip').forEach(c=>c.classList.toggle('on',c===b));
 render();
});
document.getElementById('search').addEventListener('input',e=>{
 query=e.target.value;
 render();
});

loadProducts();
</script>
</body>
</html>
