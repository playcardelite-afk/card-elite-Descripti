<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#080808">
<title>Card Elite | Streaming, Jogos e Apps</title>

<script>
/* Mostra na tela qualquer erro de JavaScript (ajuda a achar problemas no celular) */
window.addEventListener('error',function(e){
 var s=document.getElementById('status');
 if(s)s.textContent='Erro no site: '+e.message;
});
</script>

<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:#080808;color:#fff;font-family:Arial,sans-serif;font-size:14px}
.wrap{max-width:1100px;margin:0 auto}
header{height:56px;display:flex;align-items:center;gap:10px;padding:0 12px;
position:sticky;top:0;z-index:10;background:#080808;border-bottom:1px solid #252525}
.brand{font-size:18px;font-weight:900;white-space:nowrap}
.brand span{color:#ed101c}
.search{flex:1;min-width:0;background:#1c1c1c;border:1px solid #333;
border-radius:20px;padding:9px 14px;color:#fff;font-size:13px;outline:none}
.search:focus{border-color:#ed101c}
#cart{background:#ed101c;border:0;border-radius:8px;padding:8px 12px;
color:#fff;font-weight:bold;cursor:pointer;white-space:nowrap}
.hero{padding:16px 12px 6px}
.hero h1{font-size:20px;line-height:1.2}
.hero h1 span{color:#ed101c}
.hero p{color:#aaa;font-size:12px;margin-top:5px}
.chips{display:flex;gap:8px;padding:10px 12px 6px;overflow-x:auto;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:0 0 auto;background:#1c1c1c;border:1px solid #333;color:#ddd;
border-radius:18px;padding:7px 14px;font-size:13px;cursor:pointer}
.chip.on{background:#ed101c;border-color:#ed101c;color:#fff;font-weight:bold}
#status{padding:0 12px 6px;color:#888;font-size:11px;word-break:break-word}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;padding:4px 12px 22px}
@media(min-width:600px){
.grid{grid-template-columns:repeat(auto-fill,minmax(150px,1fr))}
.hero h1{font-size:26px}
}
.product{background:#141414;border:1px solid #242424;border-radius:12px;
padding:7px;display:flex;flex-direction:column;gap:6px}
.tile{aspect-ratio:1;border-radius:9px;position:relative;overflow:hidden;
display:flex;align-items:center;justify-content:center;
container-type:inline-size;box-shadow:inset 0 0 0 1px rgba(255,255,255,.08)}
.tile .bgimg{position:absolute;left:-10%;top:-10%;width:120%;height:120%;
object-fit:cover;filter:blur(14px) brightness(.55)}
.tile .fg{position:relative;width:100%;height:100%;object-fit:contain}
.tile .shine{position:absolute;inset:0;
background:radial-gradient(circle at 25% 15%,rgba(255,255,255,.22),transparent 55%)}
.mark{position:relative;font-weight:900;text-align:center;line-height:1.05;
letter-spacing:-.02em;padding:0 6%;word-break:break-word}
.tags{position:absolute;left:5%;right:5%;bottom:6%;display:flex;
flex-wrap:wrap;justify-content:center;gap:3px}
.tag{font-size:8px;font-weight:bold;padding:2px 5px;border-radius:8px;white-space:nowrap}
.tag.more{background:rgba(0,0,0,.45);color:#fff}
.product h3{font-size:12px;line-height:1.25;min-height:45px;
display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.price{color:#19d47b;font-weight:bold;font-size:13px}
.ok{font-size:10px;color:#8fd9b0}
.product button{width:100%;background:#ed101c;border:0;padding:8px;
color:#fff;border-radius:6px;font-weight:bold;font-size:12px;cursor:pointer}
.product button:active{background:#bd0710}
.empty{grid-column:1/-1;padding:30px;text-align:center;color:#aaa}
.empty button{margin-top:12px;background:#ed101c;color:#fff;border:0;
border-radius:8px;padding:10px 18px;font-weight:bold;cursor:pointer}
footer{background:#120506;border-top:1px solid #333;padding:14px 12px;
display:flex;justify-content:center;gap:6px 16px;flex-wrap:wrap;
color:#bbb;font-size:12px}
footer strong{color:#ed101c}
#toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);
background:#19d47b;color:#000;font-weight:bold;font-size:13px;
padding:10px 16px;border-radius:20px;opacity:0;pointer-events:none;
transition:.25s;z-index:20;max-width:90%;text-align:center}
#toast.show{opacity:1}
</style>
</head>

<body>
<div class="wrap">

<header>
 <div class="brand">CARD <span>ELITE</span></div>
 <input class="search" id="search" placeholder="Pesquisar produtos...">
 <button id="cart" onclick="showCart()">🛒 <span id="count">0</span></button>
</header>

<div class="hero">
 <h1>Sua diversão em <span>um só lugar</span></h1>
 <p>⚡ Entrega rápida · 🛡️ Compra segura · 🎧 Suporte especializado</p>
</div>

<div class="chips" id="chips">
 <button class="chip on" data-cat="todos">Todos</button>
 <button class="chip" data-cat="streaming">📺 Streaming</button>
 <button class="chip" data-cat="jogos">🎮 Jogos</button>
 <button class="chip" data-cat="apps">▦ Apps</button>
 <button class="chip" data-cat="outros">⭐ Outros</button>
</div>

<div id="status">Carregando catálogo...</div>
<div class="grid" id="grid"></div>

<footer>
 <span>🚀 Ativação imediata</span>
 <span>🛡️ Pagamento seguro</span>
 <span>🎧 Suporte 24h</span>
 <strong>CARD ELITE</strong>
</footer>

</div>
<div id="toast"></div>
