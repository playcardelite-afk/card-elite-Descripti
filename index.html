<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Card Elite | Streaming</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#080808;color:white;font-family:Arial,sans-serif}
header{height:68px;padding:0 5%;display:flex;align-items:center;justify-content:space-between;background:#090909;position:sticky;top:0;z-index:10;border-bottom:1px solid #252525}
.logo{font-size:25px;font-weight:900;letter-spacing:1px}
.logo span{color:#e50914}
button{cursor:pointer}
.cart-btn{background:#e50914;color:white;border:0;padding:11px 16px;border-radius:5px;font-weight:bold}
.hero{padding:65px 6%;min-height:280px;background:linear-gradient(90deg,#000 0%,#25090b 60%,#080808 100%)}
.hero small{color:#e50914;font-weight:bold;letter-spacing:3px}
.hero h1{font-size:clamp(35px,6vw,60px);margin:15px 0}
.hero p{color:#ccc;max-width:500px;line-height:1.6}
.search-area{padding:22px 5%}
.search-area input{width:100%;max-width:400px;padding:13px 16px;border:1px solid #444;background:#171717;color:white;border-radius:5px;outline:none}
#status{padding:5px 5% 15px;color:#aaa;font-size:13px}
main{padding:0 5% 45px}
.shelf{margin:25px 0 35px}
.shelf h2{font-size:21px;margin:0 0 15px}
.track{display:flex;gap:14px;overflow-x:auto;padding:3px 2px 17px;scroll-behavior:smooth}
.track::-webkit-scrollbar{height:5px}
.track::-webkit-scrollbar-thumb{background:#555;border-radius:10px}
.card{flex:0 0 195px;background:#171717;border-radius:7px;overflow:hidden;border:1px solid #292929;transition:.2s}
.card:hover{transform:scale(1.035);border-color:#e50914}
.poster{height:125px;background:linear-gradient(140deg,#4a080b,#151515);display:flex;align-items:center;justify-content:center;text-align:center;padding:12px;font-size:24px;font-weight:900;color:white}
.info{padding:13px}
.info h3{font-size:15px;margin:0 0 8px;min-height:34px}
.meta{font-size:12px;color:#aaa}
.price{font-size:21px;color:#fff;font-weight:bold;margin:12px 0}
.buy{width:100%;padding:11px;background:#e50914;color:white;border:0;border-radius:4px;font-weight:bold}
.buy:hover{background:#bd0610}
#cartBox{display:none;position:fixed;inset:0;background:#000b;z-index:30;justify-content:flex-end}
#cartBox.open{display:flex}
.panel{background:#171717;width:100%;max-width:420px;padding:22px;overflow:auto}
.close{float:right;background:none;border:0;color:white;font-size:26px}
.cart-item{padding:12px 0;border-bottom:1px solid #444}
.cart-item button{background:#333;color:white;border:0;padding:5px 9px;margin-left:5px}
.total{font-size:22px;font-weight:bold;margin:22px 0}
.checkout{width:100%;padding:14px;background:#e50914;color:white;border:0;border-radius:5px;font-weight:bold}
footer{text-align:center;padding:28px;color:#777;font-size:12px;border-top:1px solid #222}
</style>
</head>
<body>

<header>
 <div class="logo">CARD <span>ELITE</span></div>
 <button class="cart-btn" onclick="abrirCarrinho()">🛒 Carrinho (<span id="count">0</span>)</button>
</header>

<section class="hero">
 <small>CARD ELITE ORIGINAL</small>
 <h1>Entretenimento<br>sem limites.</h1>
 <p>Encontre seus serviços de streaming favoritos em um só lugar.</p>
</section>

<div class="search-area">
 <input id="busca" placeholder="🔎 Buscar produto..." oninput="filtrar()">
</div>

<div id="status">Carregando produtos...</div>
<main id="catalogo"></main>

<div id="cartBox" onclick="fecharFora(event)">
 <div class="panel">
  <button class="close" onclick="abrirCarrinho()">×</button>
  <h2>Meu carrinho</h2>
  <div id="itens"></div>
  <div class="total" id="total">Total: R$ 0,00</div>
  <button class="checkout" onclick="finalizar()">Continuar pelo WhatsApp</button>
 </div>
</div>

<footer>CARD ELITE © 2026 — Todos os direitos reservados</footer>

<script>
let produtos=[];
let carrinho=[];

const catalogo=document.getElementById("catalogo");

function dinheiro(valor){
 return (valor/100).toLocaleString("pt-BR",{style:"currency",currency:"BRL"});
}

function categoria(p){
 let s=(p.nome+" "+p.servico).toLowerCase();
 if(s.includes("netflix"))return "Netflix";
 if(s.includes("claro"))return "Claro TV+";
 if(s.includes("disney"))return "Disney+";
 if(s.includes("amazon")||s.includes("prime"))return "Prime Video";
 if(s.includes("hbo"))return "HBO Max";
 if(s.includes("apple"))return "Apple TV+";
 if(s.includes("globo"))return "Globoplay";
 if(s.includes("premiere"))return "Premiere";
 if(s.includes("telecine"))return "Telecine";
 if(s.includes("universal"))return "Universal+";
 return "Outros serviços";
}

function carregar(){
 fetch("/api/produtos")
 .then(r=>{
  if(!r.ok)throw new Error("Erro ao consultar fornecedor");
  return r.json();
 })
 .then(d=>{
  produtos=Array.isArray(d)?d:(d.produtos||[]);
  produtos=produtos.filter(p=>p.disponivel!==false);
  document.getElementById("status").textContent=produtos.length+" produtos disponíveis";
  renderizar(produtos);
 })
 .catch(e=>{
  document.getElementById("status").textContent="Não foi possível carregar o catálogo. Atualize a página.";
 });
}

function renderizar(lista){
 catalogo.innerHTML="";
 if(!lista.length){
  catalogo.innerHTML='<p class="empty">Nenhum produto encontrado.</p>';
  return;
 }
 let grupos={};
 lista.forEach(p=>{
  let c=categoria(p);
  if(!grupos[c])grupos[c]=[];
  grupos[c].push(p);
 });
 Object.keys(grupos).forEach(nome=>{
  let section=document.createElement("section");
  section.className="shelf";
  let titulo=document.createElement("h2");
  titulo.textContent=nome;
  let track=document.createElement("div");
  track.className="track";
  grupos[nome].forEach(p=>{
   let card=document.createElement("article");
   card.className="card";
   let poster=document.createElement("div");
   poster.className="poster";
   poster.textContent=nome.toUpperCase();
   let info=document.createElement("div");
   info.className="info";
   let h=document.createElement("h3");
   h.textContent=p.nome;
   let meta=document.createElement("div");
   meta.className="meta";
   meta.textContent=(p.dias||30)+" dias • "+(p.entrega==="link"?"Entrega por link":"Entrega de conta");
   let price=document.createElement("div");
   price.className="price";
   price.textContent=dinheiro(p.preco_centavos);
   let btn=document.createElement("button");
   btn.className="buy";
   btn.textContent="Adicionar ao carrinho";
   btn.onclick=()=>adicionar(p.id);
   info.append(h,meta,price,btn);
   card.append(poster,info);
   track.append(card);
  });
  section.append(titulo,track);
  catalogo.append(section);
 });
}

function filtrar(){
 let q=document.getElementById("busca").value.toLowerCase();
 renderizar(produtos.filter(p=>p.nome.toLowerCase().includes(q)));
}

function adicionar(id){
 let p=produtos.find(x=>x.id===id);
 if(!p)return;
 let item=carrinho.find(x=>x.id===id);
 if(item){
  if(item.quantidade>=p.max_quantidade){
   alert("Limite máximo deste produto atingido.");
   return;
  }
  item.quantidade++;
 }else{
  carrinho.push({id:p.id,nome:p.nome,preco:p.preco_centavos,quantidade:1,max:p.max_quantidade||10});
 }
 atualizarCarrinho();
}

function atualizarCarrinho(){
 let quantidade=carrinho.reduce((s,x)=>s+x.quantidade,0);
 document.getElementById("count").textContent=quantidade;
 let total=carrinho.reduce((s,x)=>s+x.preco*x.quantidade,0);
 document.getElementById("total").textContent="Total: "+dinheiro(total);
 let area=document.getElementById("itens");
 area.innerHTML="";
 carrinho.forEach(x=>{
  let div=document.createElement("div");
  div.className="cart-item";
  let nome=document.createElement("strong");
  nome.textContent=x.nome;
  let linha=document.createElement("p");
  linha.textContent=dinheiro(x.preco)+" × "+x.quantidade;
  let menos=document.createElement("button");
  menos.textContent="−";
  menos.onclick=()=>alterar(x.id,-1);
  let mais=document.createElement("button");
  mais.textContent="+";
  mais.onclick=()=>alterar(x.id,1);
  div.append(nome,linha,menos,mais);
  area.append(div);
 });
}

function alterar(id,n){
 let x=carrinho.find(i=>i.id===id);
 if(!x)return;
 if(n>0&&x.quantidade>=x.max)return alert("Limite máximo atingido.");
 x.quantidade+=n;
 if(x.quantidade<=0)carrinho=carrinho.filter(i=>i.id!==id);
 atualizarCarrinho();
}

function abrirCarrinho(){
 document.getElementById("cartBox").classList.toggle("open");
}
function fecharFora(e){
 if(e.target.id==="cartBox")abrirCarrinho();
}

function finalizar(){
 if(!carrinho.length)return alert("Seu carrinho está vazio.");
 let resumo=carrinho.map(x=>x.nome+" x"+x.quantidade+" - "+dinheiro(x.preco*x.quantidade)).join("\n");
 let total=carrinho.reduce((s,x)=>s+x.preco*x.quantidade,0);
 let mensagem="Olá! Quero fazer este pedido na Card Elite:\n"+resumo+"\nTotal: "+dinheiro(total);
 let telefone=""; // Coloque aqui o WhatsApp comercial com DDI e DDD
 if(!telefone){
  alert("O catálogo e o carrinho estão funcionando. Para enviar o pedido, configure o WhatsApp comercial no código.");
  return;
 }
 window.open("https://wa.me/"+telefone+"?text="+encodeURIComponent(mensagem),"_blank");
}

carregar();
</script>
</body>
</html>
