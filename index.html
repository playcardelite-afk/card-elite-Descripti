<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#080808">
<title>Card Elite | Streaming, Jogos e Apps</title>

<script>
/* Mostra na tela qualquer erro de JavaScript (ajuda a achar problemas no celular) */
window.addEventListener('error',function(e){
 var s=document.getElementById('status');
 if(s)s.textContent='Erro no site: '+e.message;
});
</script>

<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:#080808;color:#fff;font-family:Arial,sans-serif;font-size:14px}
.wrap{max-width:1100px;margin:0 auto}
header{height:56px;display:flex;align-items:center;gap:10px;padding:0 12px;
position:sticky;top:0;z-index:10;background:#080808;border-bottom:1px solid #252525}
.brand{font-size:18px;font-weight:900;white-space:nowrap}
.brand span{color:#ed101c}
.search{flex:1;min-width:0;background:#1c1c1c;border:1px solid #333;
border-radius:20px;padding:9px 14px;color:#fff;font-size:13px;outline:none}
.search:focus{border-color:#ed101c}
#cart{background:#ed101c;border:0;border-radius:8px;padding:8px 12px;
color:#fff;font-weight:bold;cursor:pointer;white-space:nowrap}
.hero{padding:16px 12px 6px}
.hero h1{font-size:20px;line-height:1.2}
.hero h1 span{color:#ed101c}
.hero p{color:#aaa;font-size:12px;margin-top:5px}
.chips{display:flex;gap:8px;padding:10px 12px 6px;overflow-x:auto;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:0 0 auto;background:#1c1c1c;border:1px solid #333;color:#ddd;
border-radius:18px;padding:7px 14px;font-size:13px;cursor:pointer}
.chip.on{background:#ed101c;border-color:#ed101c;color:#fff;font-weight:bold}
#status{padding:0 12px 6px;color:#888;font-size:11px;word-break:break-word}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;padding:4px 12px 22px}
@media(min-width:600px){
.grid{grid-template-columns:repeat(auto-fill,minmax(150px,1fr))}
.hero h1{font-size:26px}
}
.product{background:#141414;border:1px solid #242424;border-radius:12px;
padding:7px;display:flex;flex-direction:column;gap:6px}
.tile{aspect-ratio:1;border-radius:9px;position:relative;overflow:hidden;
display:flex;align-items:center;justify-content:center;
container-type:inline-size;box-shadow:inset 0 0 0 1px rgba(255,255,255,.08)}
.tile .bgimg{position:absolute;left:-10%;top:-10%;width:120%;height:120%;
object-fit:cover;filter:blur(14px) brightness(.55)}
.tile .fg{position:relative;width:100%;height:100%;object-fit:contain}
.tile .logo{position:relative;width:68%;height:68%;object-fit:contain}
.tile .shine{position:absolute;inset:0;
background:radial-gradient(circle at 25% 15%,rgba(255,255,255,.22),transparent 55%)}
.mark{position:relative;font-weight:900;text-align:center;line-height:1.05;
letter-spacing:-.02em;padding:0 6%;word-break:break-word}
.tags{position:absolute;left:5%;right:5%;bottom:6%;display:flex;
flex-wrap:wrap;justify-content:center;gap:3px}
.tag{font-size:8px;font-weight:bold;padding:2px 5px;border-radius:8px;white-space:nowrap}
.tag.more{background:rgba(0,0,0,.45);color:#fff}
.product h3{font-size:12px;line-height:1.25;min-height:45px;
display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.price{color:#19d47b;font-weight:bold;font-size:13px}
.ok{font-size:10px;color:#8fd9b0;min-height:12px}
.product.off{opacity:.55}
.product button:disabled{background:#444;color:#aaa;cursor:not-allowed}
.product button{width:100%;background:#ed101c;border:0;padding:8px;
color:#fff;border-radius:6px;font-weight:bold;font-size:12px;cursor:pointer}
.product button:active{background:#bd0710}
.empty{grid-column:1/-1;padding:30px;text-align:center;color:#aaa}
.empty button{margin-top:12px;background:#ed101c;color:#fff;border:0;
border-radius:8px;padding:10px 18px;font-weight:bold;cursor:pointer}
footer{background:#120506;border-top:1px solid #333;padding:14px 12px;
display:flex;justify-content:center;gap:6px 16px;flex-wrap:wrap;
color:#bbb;font-size:12px}
footer strong{color:#ed101c}
#toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);
background:#19d47b;color:#000;font-weight:bold;font-size:13px;
padding:10px 16px;border-radius:20px;opacity:0;pointer-events:none;
transition:.25s;z-index:20;max-width:90%;text-align:center}
#toast.show{opacity:1}
</style>
</head>

<body>
<div class="wrap">

<header>
 <div class="brand">CARD <span>ELITE</span></div>
 <input class="search" id="search" placeholder="Pesquisar produtos...">
 <button id="cart" onclick="showCart()">🛒 <span id="count">0</span></button>
</header>

<div class="hero">
 <h1>Sua diversão em <span>um só lugar</span></h1>
 <p>⚡ Entrega rápida · 🛡️ Compra segura · 🎧 Suporte especializado</p>
</div>

<div class="chips" id="chips">
 <button class="chip on" data-cat="todos">Todos</button>
 <button class="chip" data-cat="streaming">📺 Streaming</button>
 <button class="chip" data-cat="jogos">🎮 Jogos</button>
 <button class="chip" data-cat="apps">▦ Apps</button>
 <button class="chip" data-cat="outros">⭐ Outros</button>
</div>

<div id="status">Carregando catálogo...</div>
<div class="grid" id="grid"></div>

<footer>
 <span>🚀 Ativação imediata</span>
 <span>🛡️ Pagamento seguro</span>
 <span>🎧 Suporte 24h</span>
 <strong>CARD ELITE</strong>
</footer>

</div>
<div id="toast"></div>

<script>
var API='/api/produtos';
var DEBUG=/[?&]debug/.test(location.search);
var products=[];
var cart=[];
var cat='todos';
var query='';

/* chave, regex, nome na capa, cor 1, cor 2, cor do texto, etiqueta, ícone online */
var brands=[
 ['claro',/claro/,'Claro tv+','#E30613','#8E0009','#fff','Claro tv+',''],
 ['netflix',/netflix/,'NETFLIX','#1c1c1c','#000','#E50914','Netflix','netflix'],
 ['disney',/disney/,'Disney+','#1B4BE0','#0A1F7A','#fff','Disney+','disneyplus'],
 ['prime',/prime video|prime|amazon/,'prime video','#00A8E1','#0A6D94','#fff','Prime Video','primevideo'],
 ['hbo',/\bhbo\b|\bmax\b/,'HBO Max','#6A2BD9','#2E0F6B','#fff','HBO Max','hbo'],
 ['paramount',/paramount/,'Paramount+','#0064FF','#003C99','#fff','Paramount+','paramountplus'],
 ['premiere',/premiere/,'Premiere','#0FA653','#06592B','#fff','Premiere',''],
 ['telecine',/telecine/,'Telecine','#D6001C','#7A000F','#fff','Telecine',''],
 ['globoplay',/globoplay|globo/,'globoplay','#F0412C','#A3140B','#fff','Globoplay',''],
 ['apple',/apple/,'Apple TV+','#2B2B2E','#000','#fff','Apple TV+','appletv'],
 ['universal',/universal/,'Universal+','#1D3F8F','#0A1A45','#fff','Universal+',''],
 ['spotify',/spotify/,'Spotify','#1DB954','#0F6B30','#fff','Spotify','spotify'],
 ['youtube',/youtube/,'YouTube','#FF0000','#990000','#fff','YouTube','youtube'],
 ['crunchyroll',/crunchyroll/,'Crunchyroll','#F47521','#A34A0D','#fff','Crunchyroll','crunchyroll'],
 ['xbox',/xbox/,'XBOX','#107C10','#0A4A0A','#fff','Xbox','xbox'],
 ['playstation',/playstation|\bps[345]?\b/,'PlayStation','#0A47B8','#031F55','#fff','PlayStation','playstation'],
 ['minecraft',/minecraft/,'MINECRAFT','#62A54C','#2F5A22','#fff','Minecraft','minecraft'],
 ['fortnite',/fortnite/,'FORTNITE','#5B3BD0','#2A1670','#fff','Fortnite',''],
 ['roblox',/roblox/,'ROBLOX','#E2231A','#8A130D','#fff','Roblox','roblox'],
 ['canva',/canva/,'Canva','#00C4CC','#7B2FF7','#fff','Canva','canva'],
 ['adobe',/adobe/,'Adobe','#E1251B','#7A0F0A','#fff','Adobe','adobe'],
 ['office',/office|microsoft/,'Microsoft 365','#D83B01','#7A2000','#fff','Microsoft 365',''],
 ['chatgpt',/chatgpt|openai/,'ChatGPT','#10A37F','#085A45','#fff','ChatGPT',''],
 ['icloud',/icloud/,'iCloud','#3693F3','#1B4F94','#fff','iCloud','icloud'],
 ['nordvpn',/nordvpn/,'NordVPN','#4687FF','#1D3F8F','#fff','NordVPN','nordvpn']
].map(function(a){
 return {key:a[0],re:a[1],label:a[2],c1:a[3],c2:a[4],fg:a[5],tag:a[6],si:a[7]};
});

function norm(s){
 return String(s).normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase();
}
function getName(p){
 return p.name || p.nome || p.title || p.titulo ||
 p.product || p.produto || p.description || p.descricao || 'Produto';
}

/* ---------- FOTO / LOGO ---------- */
var LOGO_DIR='/logos/';
var EXTS=['png','webp','jpg','svg'];
var IMG_KEYS=['image','imagem','image_url','imageUrl','img','imagem_url',
 'url_imagem','foto','photo','picture','thumbnail','thumb','cover','capa',
 'banner','poster','logo','icon','icone','images','imagens','fotos'];

function urlFrom(v){
 if(!v)return '';
 if(typeof v==='string')return v.trim();
 if(Array.isArray(v))return urlFrom(v[0]);
 if(typeof v==='object')return urlFrom(v.url||v.src||v.link||v.path||v.large||v.original);
 return '';
}
function looksImg(s){
 return /^data:image\//.test(s) || /\.(png|jpe?g|webp|gif|svg|avif)(\?|#|$)/i.test(s);
}
function fixUrl(s){
 return /^\/\//.test(s)?'https:'+s:s;
}
function getImage(p){
 var i,u,k;
 for(i=0;i<IMG_KEYS.length;i++){
  if(p[IMG_KEYS[i]]!==undefined){
   u=urlFrom(p[IMG_KEYS[i]]);
   if(u&&(/^(https?:|data:|\/|\.)/.test(u)||looksImg(u)))return fixUrl(u);
  }
 }
 for(k in p){
  u=urlFrom(p[k]);
  if(u&&looksImg(u))return fixUrl(u);
 }
 return '';
}
function slugify(s){
 return norm(s).replace(/[^a-z0-9]+/g,'-').replace(/^-+|-+$/g,'');
}
function getService(p){
 return p.servico || p.service || p.slug || '';
}

/* Procura /logos/<nome>.png|webp|jpg|svg (cada nome é testado uma vez só) */
var logoCache={};
function findLogo(slug,cb){
 var c=logoCache[slug];
 if(c!==undefined){
  if(Array.isArray(c))c.push(cb);else cb(c);
  return;
 }
 logoCache[slug]=[cb];
 var i=0;
 (function next(){
  if(i>=EXTS.length){
   var w=logoCache[slug];
   logoCache[slug]='';
   w.forEach(function(f){f('');});
   return;
  }
  var url=LOGO_DIR+slug+'.'+EXTS[i];
  var im=new Image();
  im.onload=function(){
   var w=logoCache[slug];
   logoCache[slug]=url;
   w.forEach(function(f){f(url);});
  };
  im.onerror=function(){i++;next();};
  im.src=url;
 })();
}
function findFirst(slugs,cb){
 if(!slugs.length){cb('');return;}
 findLogo(slugs[0],function(u){
  if(u)cb(u);else findFirst(slugs.slice(1),cb);
 });
}

/* ---------- PREÇO / DADOS ---------- */
var PRICE_KEYS=['price','preco','preço','valor','sale_price','preco_venda',
 'precoVenda','valor_venda','price_brl','amount','value'];
function getPrice(p){
 var k,i,v;
 for(k in p){
  if(/centavos|cents/i.test(k)&&p[k]!==null&&p[k]!==''&&isFinite(Number(p[k])))
   return Number(p[k])/100;
 }
 for(i=0;i<PRICE_KEYS.length;i++){
  v=p[PRICE_KEYS[i]];
  if(v!==undefined&&v!==null&&v!=='')return v;
 }
 return undefined;
}
function getCategory(p){
 return String(p.category || p.categoria || p.type || p.tipo || '').toLowerCase();
}
function isAvail(p){
 var d=p.disponivel;
 return !(d===false||d===0||d==='0'||d==='false'||d==='nao'||d==='não');
}
function metaOf(p){
 var a=[];
 if(p.dias!==undefined&&p.dias!==null&&p.dias!=='')a.push(p.dias+' dias');
 if(typeof p.entrega==='string'&&p.entrega&&p.entrega.length<24){
  var e=p.entrega.replace(/_/g,' ');
  a.push(e.charAt(0).toUpperCase()+e.slice(1));
 }
 return a.join(' · ');
}
function money(v){
 if(v===undefined || v===null || v==='')return 'Consulte';
 if(typeof v==='string' && /R\$/.test(v))return v;
 var n=Number(String(v).replace(',','.'));
 return Number.isFinite(n)?n.toLocaleString('pt-BR',
 {style:'currency',currency:'BRL'}):String(v);
}
function classify(p){
 var s=norm(getName(p)+' '+getService(p)+' '+getCategory(p));
 if(/netflix|disney|prime video|amazon prime|\bhbo\b|\bmax\b|globoplay|spotify|crunchyroll|youtube|paramount|premiere|telecine|claro|apple tv|universal|streaming/.test(s))return 'streaming';
 if(/game|jogo|xbox|playstation|roblox|minecraft|fortnite|free fire|nintendo|steam/.test(s))return 'jogos';
 if(/\bapp\b|canva|adobe|office|microsoft|chatgpt|google|icloud|vpn/.test(s))return 'apps';
 return 'outros';
}

/* ---------- CAPA ---------- */
function hashHue(s){
 var h=0;
 for(var i=0;i<s.length;i++)h=(h*31+s.charCodeAt(i))%360;
 return h;
}
function fitMark(el,label,max){
 var px=Math.max(11,Math.min(max,Math.floor(150/Math.max(label.length,5)*1.6)));
 var cq=Math.max(8,Math.min(max*0.6,80/(label.length*0.62)));
 el.style.cssText+=';font-size:'+px+'px;font-size:'+cq.toFixed(1)+'cqw';
}
/* Arte de reserva: cor da marca (ou cor gerada) com o nome do produto */
function drawArt(tile,name){
 var res={main:null,mark:null,tags:null};
 var t=norm(name);
 var found=brands.filter(function(b){return b.re.test(t);});
 var claro=found.filter(function(b){return b.key==='claro';})[0];
 var rest=found.filter(function(b){return b!==claro;});
 var main=claro||rest[0];
 var chips=claro?rest:rest.slice(1);
 var m=document.createElement('div');
 m.className='mark';
 var shine=document.createElement('div');
 shine.className='shine';
 if(!main){
  var h=hashHue(name);
  tile.style.background='linear-gradient(145deg,hsl('+h+' 55% 34%),hsl('+h+' 55% 14%))';
  var label=name.split(/\s+/).slice(0,2).join(' ');
  m.textContent=label;
  m.style.color='#fff';
  fitMark(m,label,22);
  tile.append(shine,m);
  res.mark=m;
  return res;
 }
 tile.style.background='linear-gradient(145deg,'+main.c1+','+main.c2+')';
 m.textContent=main.label;
 m.style.color=main.fg;
 fitMark(m,main.label,26);
 if(chips.length)m.style.marginBottom='18%';
 tile.append(shine,m);
 if(chips.length){
  var tags=document.createElement('div');
  tags.className='tags';
  chips.slice(0,3).forEach(function(c){
   var s=document.createElement('span');
   s.className='tag';
   s.textContent=c.tag;
   s.style.background=c.c1;
   s.style.color=c.fg;
   tags.appendChild(s);
  });
  if(chips.length>3){
   var more=document.createElement('span');
   more.className='tag more';
   more.textContent='+'+(chips.length-3);
   tags.appendChild(more);
  }
  tile.appendChild(tags);
  res.tags=tags;
 }
 res.main=main;
 res.mark=m;
 return res;
}
function hex6(c){return c==='#fff'?'FFFFFF':c.replace('#','');}

function applyImage(tile,art,img,mode){
 if(mode==='photo'){
  tile.replaceChildren();
  tile.style.background='#151515';
  var bg=document.createElement('img');
  bg.className='bgimg';
  bg.alt='';
  bg.src=img.src;
  img.className='fg';
  tile.append(bg,img);
 }else{
  if(art.mark)art.mark.style.display='none';
  img.className='logo';
  if(art.tags)img.style.cssText+=';height:52%;width:70%;margin-bottom:16%';
  tile.appendChild(img);
 }
}
function loadImg(url,mode,tile,art,onfail){
 var im=new Image();
 im.alt='';
 im.onload=function(){applyImage(tile,art,im,mode);};
 im.onerror=onfail;
 im.src=url;
}
/* Ordem: foto da API -> arquivo em /logos -> ícone online -> capa colorida */
function makeTile(p){
 var name=getName(p);
 var tile=document.createElement('div');
 tile.className='tile';
 var art=drawArt(tile,name);
 var slugs=[];
 var sv=getService(p);
 if(sv)slugs.push(slugify(sv));
 if(art.main&&slugs.indexOf(art.main.key)<0)slugs.push(art.main.key);
 function stage3(){
  if(art.main&&art.main.si){
   loadImg('https://cdn.simpleicons.org/'+art.main.si+'/'+hex6(art.main.fg),
    'logo',tile,art,function(){});
  }
 }
 function stage2(){
  findFirst(slugs,function(u){
   if(u)loadImg(u,'logo',tile,art,stage3);else stage3();
  });
 }
 var api=getImage(p);
 if(api)loadImg(api,'photo',tile,art,stage2);else stage2();
 return tile;
}

function makeCard(p){
 var name=getName(p);
 var idx=products.indexOf(p);
 var avail=isAvail(p);
 var card=document.createElement('article');
 card.className='product'+(avail?'':' off');
 var title=document.createElement('h3');
 title.textContent=name;
 var value=document.createElement('div');
 value.className='price';
 value.textContent=money(getPrice(p));
 var ok=document.createElement('div');
 ok.className='ok';
 ok.textContent=metaOf(p);
 var btn=document.createElement('button');
 if(avail){
  btn.textContent='Selecionar';
  btn.onclick=function(){addCart(idx);};
 }else{
  btn.textContent='Indisponível';
  btn.disabled=true;
 }
 card.append(makeTile(p),title,value,ok,btn);
 return card;
}

function render(){
 var grid=document.getElementById('grid');
 grid.replaceChildren();
 var q=norm(query).trim();
 var list=products.filter(function(p){
  return (cat==='todos'||classify(p)===cat) && norm(getName(p)).indexOf(q)!==-1;
 });
 list.forEach(function(p){grid.appendChild(makeCard(p));});
 if(!list.length){
  var e=document.createElement('div');
  e.className='empty';
  e.textContent='Nenhum produto encontrado.';
  grid.appendChild(e);
 }
}

function showLoadError(msg){
 document.getElementById('status').textContent='Não foi possível carregar o catálogo: '+msg;
 var grid=document.getElementById('grid');
 grid.replaceChildren();
 var e=document.createElement('div');
 e.className='empty';
 e.textContent='Não foi possível carregar os produtos agora.';
 var b=document.createElement('button');
 b.textContent='Tentar de novo';
 b.onclick=loadProducts;
 e.appendChild(document.createElement('br'));
 e.appendChild(b);
 grid.appendChild(e);
}

async function loadProducts(){
 var status=document.getElementById('status');
 status.textContent='Carregando catálogo...';
 var ctl=new AbortController();
 var timer=setTimeout(function(){ctl.abort();},20000);
 try{
  var response=await fetch(API,{headers:{'Accept':'application/json'},signal:ctl.signal,cache:'no-store'});
  clearTimeout(timer);
  if(!response.ok)throw new Error('Erro HTTP '+response.status);
  var data=await response.json();
  products=Array.isArray(data)?data:
   data.products || data.produtos || data.data ||
   data.result || data.items || [];
  if(!Array.isArray(products))products=[];
  if(!products.length){
   status.textContent='A API respondeu, mas não encontramos uma lista de produtos.';
  }else{
   status.textContent=products.length+' produtos disponíveis';
   if(DEBUG){
    status.textContent+=' | exemplo: '+JSON.stringify(products[0]);
   }
  }
  render();
 }catch(error){
  clearTimeout(timer);
  showLoadError(error.name==='AbortError'?'o servidor demorou para responder':error.message);
 }
}

var toastTimer;
function toast(msg){
 var t=document.getElementById('toast');
 t.textContent=msg;
 t.classList.add('show');
 clearTimeout(toastTimer);
 toastTimer=setTimeout(function(){t.classList.remove('show');},1800);
}
function addCart(index){
 var p=products[index];
 if(!p)return;
 cart.push(p);
 document.getElementById('count').textContent=cart.length;
 toast(getName(p)+' adicionado!');
}
function showCart(){
 if(!cart.length){
  toast('Sua seleção está vazia.');
  return;
 }
 var total=0,hasAll=true;
 var lines=cart.map(function(p){
  var v=getPrice(p);
  var n=Number(v);
  if(v===undefined||!Number.isFinite(n))hasAll=false;else total+=n;
  return getName(p)+' - '+money(v);
 });
 alert('Produtos selecionados:\n'+lines.join('\n')+(hasAll?'\n\nTotal: '+money(total):''));
}

document.getElementById('chips').addEventListener('click',function(e){
 var b=e.target.closest('.chip');
 if(!b)return;
 cat=b.dataset.cat;
 document.querySelectorAll('.chip').forEach(function(c){c.classList.toggle('on',c===b);});
 render();
});
document.getElementById('search').addEventListener('input',function(e){
 query=e.target.value;
 render();
});

loadProducts();
</script>
</body>
